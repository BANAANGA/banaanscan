# Builds a signed release APK for every version tag (v1.2.3) and attaches it to a GitHub Release, which is what
# Obtainium follows. Needs the repository secrets RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :app:testDebugUnitTest :mt7921u:test --console=plain

      - name: Build signed APK
        env:
          BANAANSCAN_VERSION: ${{ github.ref_name }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          export RELEASE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE_FILE"
          ./gradlew :app:assembleRelease --console=plain
          rm -f "$RELEASE_KEYSTORE_FILE"
          cp app/build/outputs/apk/release/app-release.apk "banaanscan-${GITHUB_REF_NAME}.apk"

      - name: Check the signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "banaanscan-${GITHUB_REF_NAME}.apk" | tee signature.txt
          grep -q "CN=BanaanScan" signature.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "banaanscan-${GITHUB_REF_NAME}.apk" \
            --title "BanaanScan ${GITHUB_REF_NAME}" --generate-notes
